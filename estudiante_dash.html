<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Aula Virtual - Estudiante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .nav-tabs .nav-link { color: #6c757d; font-weight: 500; border: none; }
        .nav-tabs .nav-link.active { color: #0d6efd; border-bottom: 3px solid #0d6efd; background: none; }
        .bg-gradient-navbar { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-navbar shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
                <span class="fs-4 me-2">🎓</span> Grucomer Edu
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <span id="estudiante-name" class="text-white-50 small fw-medium">
                    <i class="bi bi-hourglass-split me-1"></i> Validando Identidad...
                </span>
                <button id="btn-logout" class="btn btn-sm btn-outline-light rounded-pill px-3">
                    <i class="bi bi-box-arrow-right me-1"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-lg-6 mx-auto text-center">
                <div class="card shadow-sm border-0 p-4">
                    <label for="select-curso-estudiante" class="form-label fw-bold text-secondary mb-2">
                        <i class="bi bi-book me-1"></i> MIS CURSOS MATRICULADOS:
                    </label>
                    <select id="select-curso-estudiante" class="form-select form-select-lg border-2 border-primary-subtle text-dark" onchange="cambiarCursoActivo(this.value)">
                        <option value="">-- Cargando tus asignaturas... --</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="mensaje-espera-curso" class="text-center py-5">
            <div class="text-muted fs-1 mb-3"><i class="bi bi-arrow-up-circle"></i></div>
            <h5 class="text-secondary fw-semibold">Por favor, selecciona un curso del menú superior</h5>
            <p class="text-muted small">Aquí podrás revisar todo el material de estudio compartido por tu docente.</p>
        </div>

        <div id="zona-trabajo-estudiante" class="d-none">
            
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                    <h5 class="card-title fw-bold text-dark mb-0">
                        <i class="bi bi-folder-symlink text-primary me-2"></i> Material Didáctico y Enlaces
                    </h5>
                </div>
                <div class="card-body p-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-secondary">
                                <tr>
                                    <th style="width: 15%;">Semana</th>
                                    <th style="width: 55%;">Tema / Descripción</th>
                                    <th style="width: 30%;" class="text-end">Acceso al Material</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-recursos-estudiante-body">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="estudiante.js"></script>
</body>
</html>
