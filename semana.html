<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Materiales de la Semana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card-recurso { transition: all 0.3s ease; }
    .card-recurso:hover { transform: scale(1.02); }
  </style>
</head>
<body class="container my-5">

  <div class="mb-3">
    <a href="cursos.html" class="btn btn-sm btn-outline-secondary">← Volver a mis asignaturas</a>
  </div>

  <h2 id="tituloSemana" class="mb-4">Cargando materiales...</h2>

  <div id="loading" class="d-flex justify-content-center my-5">
    <div class="spinner-border text-success" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div id="linksContainer" class="row"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // 1. CAPTURAR PARÁMETROS URL
    const params = new URLSearchParams(window.location.search);
    const cursoId = params.get("curso");   // El ID numérico del curso de Supabase
    const semanaNum = params.get("semana"); // El número de semana (1, 2, 3 o 4)

    // 2. CONFIGURACIÓN DE SUPABASE
    const SUPABASE_URL = "https://gfspoibkfuuwzahjswok.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmc3BvaWJrZnV1d3phaGpzd29rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MTI1MzYsImV4cCI6MjA5NDk4ODUzNn0.1Ax6NmdOy0JMnGvDpH9zfu9VNsb0StssofggO9daT4k";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Validación de seguridad inicial en la URL
    if (!cursoId || !semanaNum) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("tituloSemana").textContent = "Error de Acceso";
      document.getElementById("linksContainer").innerHTML = "<div class='alert alert-danger'>Faltan parámetros de navegación en la URL.</div>";
    } else {
      cargarContenidoSemana();
    }

    // 3. LOGICA PRINCIPAL ASÍNCRONA
    async function cargarContenidoSemana() {
      const loadingEl = document.getElementById("loading");
      const container = document.getElementById("linksContainer");
      const tituloEl = document.getElementById("tituloSemana");

      try {
        // PASO A: Traernos el nombre real del curso desde la tabla 'cursos'
        const { data: cursoData, error: cursoError } = await supabaseClient
          .from('cursos')
          .select('nombre')
          .eq('id', cursoId)
          .single();

        if (cursoError) throw cursoError;

        // Cambiar el título principal de la pantalla
        tituloEl.textContent = `📚 ${cursoData.nombre} — Semana ${semanaNum}`;

        // PASO B: Traernos los recursos de este curso, de esta semana, y que sean VISIBLES
        const { data: recursos, error: recursosError } = await supabaseClient
          .from('recursos')
          .select('*')
          .eq('curso_id', cursoId)
          .eq('semana', parseInt(semanaNum))
          .eq('es_visible', true) // <-- Filtro de privacidad indispensable para alumnos
          .order('created_at', { ascending: true });

        if (recursosError) throw recursosError;

        // Ocultar el loader
        loadingEl.style.display = "none";
        container.innerHTML = "";

        // Si la semana está vacía
        if (recursos.length === 0) {
          container.innerHTML = `
            <div class="col-12">
              <div class="alert alert-info text-center py-4">
                No hay materiales cargados o visibles para esta semana todavía.
              </div>
            </div>`;
          return;
        }

        // PASO C: Iterar los recursos y dibujarlos
        recursos.forEach(recurso => {
          const col = document.createElement("div");
          col.className = "col-md-6 col-lg-4 mb-4";

          // Definición de colores dinámicos basándonos en tu diseño original
          let colorHeader = "bg-info";
          let textoExtra = "";
          
          switch (semanaNum) {
            case "1": colorHeader = "bg-success text-white"; break;
            case "2": colorHeader = "bg-primary text-white"; break;
            case "3": colorHeader = "bg-warning text-dark"; break;
            case "4": colorHeader = "bg-danger text-white"; break;
          }

          col.innerHTML = `
            <div class="card card-recurso h-100 shadow-sm">
              <div class="card-header ${colorHeader} fw-bold">
                📄 ${recurso.titulo}
              </div>
              <div class="card-body d-flex flex-column justify-content-between">
                <p class="card-text text-muted small">Este recurso fue compartido por tu docente para las actividades de la semana.</p>
                <a href="${recurso.url_drive}" target="_blank" class="btn btn-outline-dark w-100 mt-2">
                  🚀 Acceder al Recurso
                </a>
              </div>
            </div>
          `;
          container.appendChild(col);
        });

      } catch (err) {
        console.error(err);
        loadingEl.style.display = "none";
        tituloEl.textContent = "Error";
        container.innerHTML = "<div class='alert alert-danger text-center'>Error de conexión al cargar los recursos de Supabase.</div>";
      }
    }
  </script>

</body>
</html>
