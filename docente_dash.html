<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👨‍🏫 Aula Virtual - Panel del Docente</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold text-primary" href="#">🎓 Grucomer <span class="text-white">Edu</span></a>
      <div class="d-flex align-items-center ms-auto">
        <span class="text-light me-3 small" id="docente-name">
          <i class="bi bi-person-circle me-1"></i> Validando Credenciales...
        </span>
        <button class="btn btn-sm btn-outline-danger fw-bold" id="btn-logout">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    
    <div class="row mb-4">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body bg-white rounded">
            <label for="select-curso-docente" class="form-label fw-bold text-secondary text-uppercase small">
              <i class="bi bi-journal-bookmark-fill me-1"></i> Selecciona tu Curso / Paralelo:
            </label>
            <select class="form-select" id="select-curso-docente" onchange="window.cambiarCursoActivo(this.value)">
              <option value="">-- Cargando cursos asignados --</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div id="zona-trabajo-docente" class="d-none">
      
      <ul class="nav nav-tabs mb-4" id="pestañasCurso" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-bold" id="tab-recursos" onclick="window.cambiarSubVista('recursos')">
            <i class="bi bi-folder-symlink me-1"></i> Recursos Académicos
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-bold" id="tab-alumnos" onclick="window.cambiarSubVista('alumnos')">
            <i class="bi bi-people-fill me-1"></i> Alumnos Matriculados
          </button>
        </li>
      </ul>

      <div id="vista-recursos" class="">
        <div class="row">
          <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0">
              <div class="card-header bg-primary text-white fw-bold py-2">
                <i class="bi bi-plus-circle me-1"></i> Añadir Recurso
              </div>
              <div class="card-body">
                <form id="form-recurso">
                  <div class="mb-3">
                    <label class="form-label small fw-semibold">Título del Material:</label>
                    <input type="text" id="rec-titulo" class="form-control form-control-sm" placeholder="Ej: Diapositivas - Clase Introductoria" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small fw-semibold">Enlace / URL (Drive, Zoom, Mega):</label>
                    <input type="url" id="rec-url" class="form-control form-control-sm" placeholder="https://..." required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small fw-semibold">Semana correspondiente:</label>
                    <select id="rec-semana" class="form-select form-select-sm" required>
                      <option value="1">Semana 1</option>
                      <option value="2">Semana 2</option>
                      <option value="3">Semana 3</option>
                      <option value="4">Semana 4</option>
                    </select>
                  </div>
                  <div class="mb-3 form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="rec-visible" checked>
                    <label class="form-check-label small fw-semibold" for="rec-visible">Visible para estudiantes</label>
                  </div>
                  <button type="submit" class="btn btn-sm btn-primary w-100 fw-bold">
                    <i class="bi bi-cloud-upload"></i> Publicar Recurso
                  </button>
                </form>
              </div>
            </div>
          </div>

          
          
          <div class="col-md-8 mb-4">
            <div class="card shadow-sm border-0">
              <div class="card-body">
                <h5 class="fw-bold text-dark border-bottom pb-2">Materiales Publicados</h5>
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="table-light text-secondary small text-uppercase">
                      <tr>
                        <th style="width: 15%;">Semana</th>
                        <th style="width: 40%;">Recurso / Título</th>
                        <th style="width: 20%;">Enlace</th>
                        <th style="width: 15%;">Estado</th>
                        <th style="width: 10%;" class="text-end">Acción</th>
                      </tr>
                    </thead>
                    <tbody id="tabla-recursos-body"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

<div id="vista-alumnos" class="d-none">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            
            <div class="row mb-3 justify-content-end">
                <div class="col-md-5 col-sm-8">
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" 
                               id="input-busqueda-alumno" 
                               class="form-control border-start-0" 
                               placeholder="Buscar por nombre o cédula..."
                               onkeyup="filtrarAlumnosEnPantalla()">
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-secondary">
                        <tr>
                            <th>Nombres y Apellidos</th>
                            <th>Cédula</th>
                            <th>Celular</th>
                            <th>Correo Electrónico</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-alumnos-body">
                        </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

    </div>

    <div id="mensaje-espera-curso" class="text-center py-5 text-muted">
      <i class="bi bi-arrow-up-circle display-4 text-secondary"></i>
      <p class="mt-2 fw-semibold">Por favor, selecciona un curso del menú superior para administrar los módulos académicos.</p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="docente.js"></script>
</body>
</html>
