<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiantes - Aula Virtual</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* Efecto de desenfoque cuando la página está bloqueada */
    .blur-content {
      filter: blur(8px);
      pointer-events: none;
      user-select: none;
      transition: filter 0.3s ease;
    }
  </style>
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

  <!-- Modal de Bloqueo por Clave (No se puede cerrar haciendo clic afuera ni con ESC) -->
  <div class="modal fade" id="modalClave" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-lg border-0 rounded-3">
        <div class="modal-header bg-primary text-white border-0">
          <h5 class="modal-title fw-bold"><i class="bi bi-shield-lock-fill me-2"></i>Acceso Restringido</h5>
        </div>
        <div class="modal-body p-4">
          <p class="text-muted small">Ingresa la clave de acceso privada para desbloquear el formulario de inscripción.</p>
          
          <div class="mb-3">
            <label for="input-clave" class="form-label fw-semibold">Clave de Acceso</label>
            <input type="password" id="input-clave" class="form-control" placeholder="Escribe la clave aquí" autocomplete="off">
            <div id="error-clave" class="invalid-feedback">Clave incorrecta. Verifica e intenta de nuevo.</div>
          </div>

          <button type="button" id="btn-validar-clave" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-unlock-fill me-1"></i> Desbloquear Acceso
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenido Principal (Inicialmente bloqueado/desenfocado) -->
  <div id="contenido-principal" class="container my-5 blur-content">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <div class="card shadow-lg border-0 rounded-3">
          <div class="card-body p-4 p-sm-5">
            
            <div class="text-center mb-4">
              <h2 class="fw-bold text-primary">🎓 Aula Virtual</h2>
              <p class="text-muted">Formulario de inscripción para estudiantes</p>
            </div>

            <!-- Autocomplete desactivado para evitar cacheo de datos -->
            <form id="form-registro" autocomplete="off" novalidate>
              
              <div class="mb-3">
                <label for="reg-cedula" class="form-label fw-semibold">Cédula de Identidad</label>
                <input type="text" id="reg-cedula" class="form-control" placeholder="Ej. 1700000000" required autocomplete="off" inputmode="numeric" pattern="[0-9]{10}">
              </div>

              <div class="mb-3">
                <label for="reg-nombre" class="form-label fw-semibold">Nombre y Apellido Completos</label>
                <input type="text" id="reg-nombre" class="form-control" placeholder="Ej. Juan Pérez" required autocomplete="off">
              </div>

              <div class="mb-3">
                <label for="reg-celular" class="form-label fw-semibold">Número de Celular</label>
                <input type="tel" id="reg-celular" class="form-control" placeholder="Ej. 0999999999" required autocomplete="off" inputmode="tel" pattern="[0-9]{10}">
              </div>

              <div class="mb-3">
                <label for="reg-correo" class="form-label fw-semibold">Correo Electrónico Personal</label>
                <input type="email" id="reg-correo" class="form-control" placeholder="Ej. juan@gmail.com" required autocomplete="off">
              </div>

              <div class="mb-4">
                <label for="reg-curso" class="form-label fw-semibold">Curso al que se postula</label>
                <select id="reg-curso" class="form-select" required autocomplete="off">
                  <option value="" selected disabled>Cargando cursos disponibles...</option>
                </select>
              </div>

              <button type="submit" id="btn-enviar" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-person-plus-fill me-2"></i> Solicitar Acceso
              </button>

            </form>

            <div class="text-center mt-4">
              <a href="aula_virtual.html" class="text-decoration-none small">¿Ya tienes una cuenta aprobada? Inicia Sesión</a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="registro.js"></script>
  
</body>
</html>
